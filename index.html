<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecolum Manufacture</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/menus/stok.css">
    <link rel="stylesheet" href="css/menus/timeline.css">
    <link rel="stylesheet" href="css/print.css">
</head>
<body class="bg-gray-100">

    <div id="loading-overlay" style="display: none; position: fixed; inset: 0; background: rgba(255,255,255,0.8); z-index: 9999; justify-content: center; align-items: center; flex-direction: column;">
        <div class="spinner mb-4"></div>
        <p id="loading-text" class="text-gray-600 font-semibold">Memproses...</p>
    </div>

    <!-- HALAMAN LOGIN -->
    <div id="login-section" class="min-h-screen flex items-center justify-center bg-gray-200 w-full absolute z-50">
        <div class="bg-white p-8 rounded-lg shadow-lg w-96 text-center">
            <div class="text-indigo-600 text-5xl mb-4"><i class="fas fa-leaf"></i></div>
            <h2 class="text-2xl font-bold text-gray-800 mb-1">Ecolum Manufacture</h2>
            <p class="text-sm text-gray-500 mb-6">Sistem Manajemen ERP Terpadu</p>
            <div class="mb-4 text-left"><label class="block text-sm font-semibold text-gray-600 mb-1">Username</label><input type="text" id="username" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-indigo-500" value="admin" autocomplete="off"></div>
            <div class="mb-6 text-left"><label class="block text-sm font-semibold text-gray-600 mb-1">Password</label><input type="password" id="password" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-indigo-500" value="admin"></div>
            <button onclick="doLogin()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded shadow-lg transition">Masuk Workspace</button>
        </div>
    </div>

    <!-- APLIKASI UTAMA -->
    <div id="app-section" class="flex h-screen overflow-hidden hidden">
        <!-- SIDEBAR -->
        <div id="sidebar" class="w-64 bg-gray-800 text-white flex flex-col no-print">
            <div class="p-5 flex items-center border-b border-gray-700"><i class="fas fa-leaf text-green-400 text-2xl mr-3"></i><span class="text-xl font-bold tracking-wide">Ecolum</span></div>
            
            <div class="flex-1 overflow-y-auto py-4 text-sm">
                <a href="#" onclick="showMenu('Dashboard')" class="block px-5 py-3 hover:bg-gray-700 menu-item"><i class="fas fa-chart-pie w-6 text-indigo-400"></i> Dashboard</a>

                <div class="px-5 py-3 text-xs text-gray-400 uppercase font-bold tracking-wider bg-gray-900 mt-2"><i class="fas fa-boxes mr-1"></i> Manajemen Stok</div>
                <a href="#" onclick="showMenu('Stok_Masuk')" class="block pl-8 pr-5 py-2.5 hover:bg-gray-700 menu-item"><i class="fas fa-arrow-circle-down w-5 text-green-400"></i> Barang Masuk</a>
                <a href="#" onclick="showMenu('Stok_Keluar')" class="block pl-8 pr-5 py-2.5 hover:bg-gray-700 menu-item"><i class="fas fa-arrow-circle-up w-5 text-red-400"></i> Barang Keluar</a>
                <a href="#" onclick="showMenu('Stok_Data')" class="block pl-8 pr-5 py-2.5 hover:bg-gray-700 menu-item"><i class="fas fa-warehouse w-5 text-gray-400"></i> Data Stok</a>

                <div class="px-5 py-3 text-xs text-gray-400 uppercase font-bold tracking-wider bg-gray-900 mt-2"><i class="fas fa-project-diagram mr-1"></i> Data Project</div>
                <a href="#" onclick="showMenu('Project')" class="block pl-8 pr-5 py-2.5 hover:bg-gray-700 menu-item"><i class="fas fa-list w-5 text-gray-400"></i> Daftar Project</a>
                <a href="#" onclick="showMenu('Timeline')" class="block pl-8 pr-5 py-2.5 hover:bg-gray-700 menu-item"><i class="fas fa-calendar-alt w-5 text-yellow-400"></i> Timeline</a>
                <a href="#" onclick="showMenu('RAP_Awal')" class="block pl-8 pr-5 py-2.5 hover:bg-gray-700 menu-item"><i class="fas fa-file-invoice-dollar w-5 text-gray-400"></i> RAP Awal</a>
                <a href="#" onclick="showMenu('RAP_Belanja')" class="block pl-8 pr-5 py-2.5 hover:bg-gray-700 menu-item"><i class="fas fa-shopping-cart w-5 text-gray-400"></i> RAP Belanja</a>
                <a href="#" onclick="showMenu('RAP_Final')" class="block pl-8 pr-5 py-2.5 hover:bg-gray-700 menu-item"><i class="fas fa-file-contract w-5 text-gray-400"></i> RAP Final</a>

                <div class="px-5 py-3 text-xs text-gray-400 uppercase font-bold tracking-wider bg-gray-900 mt-2"><i class="fas fa-database mr-1"></i> Data Master</div>
                <a href="#" onclick="showMenu('Master_Material')" class="block pl-8 pr-5 py-2.5 hover:bg-gray-700 menu-item"><i class="fas fa-box w-5 text-gray-400"></i> Material</a>
                <a href="#" onclick="showMenu('Master_Jasa')" class="block pl-8 pr-5 py-2.5 hover:bg-gray-700 menu-item"><i class="fas fa-users w-5 text-gray-400"></i> Jasa</a>
                <a href="#" onclick="showMenu('Master_Operasional')" class="block pl-8 pr-5 py-2.5 hover:bg-gray-700 menu-item"><i class="fas fa-truck w-5 text-gray-400"></i> Operasional</a>
            </div>

            <div class="p-4 border-t border-gray-700 bg-gray-900">
                <div class="flex items-center mb-3">
                    <div id="user-initial" class="w-10 h-10 rounded-full bg-indigo-600 flex items-center justify-center text-white font-bold text-lg shadow-inner mr-3">U</div>
                    <div class="overflow-hidden">
                        <div id="user-name" class="text-sm font-bold text-white truncate">User</div>
                        <div id="user-role" class="text-xs text-gray-400 truncate">Administrator</div>
                    </div>
                </div>
                <button onclick="logout()" class="w-full bg-gray-800 hover:bg-red-600 border border-gray-700 hover:border-red-600 transition-colors text-gray-300 hover:text-white text-sm py-2 rounded shadow"><i class="fas fa-sign-out-alt mr-2"></i> Keluar Sistem</button>
            </div>
        </div>

        <div class="flex-1 flex flex-col bg-gray-100">
            <div id="header-top" class="bg-white p-4 shadow flex justify-between items-center no-print"><h1 id="header-title" class="text-xl font-bold text-gray-700 uppercase tracking-wide">Dashboard</h1></div>
            <div class="p-6 flex-1 overflow-y-auto" id="main-content"></div>
        </div>
    </div>

    <!-- KERANGKA: kode tiap menu (js/menus/*) dan modalnya dimuat saat menunya dibuka. Daftar menu: js/core/menus.js -->
    <script src="js/core/config.js"></script>
    <script src="js/core/state.js"></script>
    <script src="js/core/ui.js"></script>
    <script src="js/core/api.js"></script>
    <script src="js/core/auth.js"></script>
    <script src="js/core/menus.js"></script>
    <script src="js/core/router.js"></script>

</body>
</html>
